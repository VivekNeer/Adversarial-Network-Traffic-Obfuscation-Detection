# Both surfaces. Tests whether the sequence and the aggregates are complementary.
name: hybrid
seed: 42

dataset:
  source: cached
  path: data/processed/dataset.npz

train:
  model: hybrid
  epochs: 60
  batch_size: 128
  lr: 0.001
  patience: 12
  selection_metric: macro_f1

defense:
  method: none

baselines: [random_forest]

attacks:
  - {name: fgsm, surface: both, eps: 0.05}
  - {name: fgsm, surface: both, eps: 0.1}
  - {name: pgd, surface: both, eps: 0.05, steps: 10}
  - {name: pgd, surface: both, eps: 0.1, steps: 10}
  - {name: pgd, surface: both, eps: 0.2, steps: 20}
  - {name: pgd, surface: both, eps: 0.1, steps: 10, constrained: false}
  - {name: pgd, surface: both, eps: 0.1, steps: 10, targeted: true}

output:
  dir: experiments/results/hybrid
