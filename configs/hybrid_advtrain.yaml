# The defended model. Same architecture, same loop, same seed as hybrid.yaml --
# so any difference between the two is the defense and nothing else.
name: hybrid_advtrain
seed: 42

dataset:
  source: cached
  path: data/processed/dataset.npz

train:
  model: hybrid
  epochs: 60
  batch_size: 128
  lr: 0.001
  patience: 12
  selection_metric: macro_f1
  # Half of each batch stays clean. Training only on perturbed flows trades away
  # ordinary-traffic accuracy, and a detector that got worse on real traffic to
  # survive an attack has not obviously been improved.
  adv_ratio: 0.5

defense:
  method: adversarial_training
  attack:
    # Deliberately weaker than the evaluation attack (5 steps vs 10-20). Training
    # against the exact test-time attack is circular: the model fits that one
    # perturbation and the robustness number stops generalising.
    name: pgd
    surface: both
    eps: 0.1
    steps: 5
    constrained: true

baselines: [random_forest]

attacks:
  - {name: fgsm, surface: both, eps: 0.05}
  - {name: fgsm, surface: both, eps: 0.1}
  - {name: pgd, surface: both, eps: 0.05, steps: 10}
  - {name: pgd, surface: both, eps: 0.1, steps: 10}
  - {name: pgd, surface: both, eps: 0.2, steps: 20}
  - {name: pgd, surface: both, eps: 0.1, steps: 10, constrained: false}
  - {name: pgd, surface: both, eps: 0.1, steps: 10, targeted: true}

output:
  dir: experiments/results/hybrid_advtrain
